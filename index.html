<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AALogs - Generated Reports</title>
    <link rel="stylesheet" href="assets/index.css">
</head>
<body>
    <main class="container">
        <header class="index-header"><h1>AALogs</h1></header>
        <h2 class="report-heading">Generated reports</h2>
        <div class="report-controls">
            <button id="refresh-reports" type="button">Refresh reports</button>
            <span id="report-status" role="status" aria-live="polite">Loading reports...</span>
        </div>
        <section id="report-results" aria-live="polite"></section>
    </main>
    <script src="assets/pages-index.js"
        data-reports-path="releasebuild/output/reports"></script>
</body>
</html>
